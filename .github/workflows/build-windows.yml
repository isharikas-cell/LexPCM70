name: Build Windows VST3
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S PCM70_Legacy_VST3_Source_Windows_v0.4.2_metadata_fix/PCM70_Legacy_VST3_Source -B build -G "Visual Studio 17 2022" -A x64
      - name: Build VST3
        run: cmake --build build --config Release --target PCM70Legacy_VST3 --parallel
      - name: Verify and repair VST3 metadata
        shell: pwsh
        run: |
          $bundle = "build/PCM70Legacy_artefacts/Release/VST3/PCM70 Legacy GUI TEST.vst3"
          if (!(Test-Path $bundle)) { throw "Expected VST3 bundle was not produced: $bundle" }
          $metadata = Join-Path $bundle "Contents/Resources/moduleinfo.json"
          if (!(Test-Path $metadata)) { throw "VST3 moduleinfo.json was not produced: $metadata" }
          $json = Get-Content $metadata -Raw
          $json = [regex]::Replace($json, ',(\s*[}\]])', '$1')
          $parsed = $json | ConvertFrom-Json
          $json | Set-Content -Path $metadata -Encoding utf8
          $check = Get-Content $metadata -Raw | ConvertFrom-Json
          if ($check.Version -ne "0.4.6") { throw "moduleinfo.json version is not 0.4.6 (found: $($check.Version))" }
          Write-Host "Validated moduleinfo.json version: $($check.Version)"
          Get-ChildItem $bundle -Recurse | Select-Object FullName, Length
      - name: Package VST3
        shell: pwsh
        run: Compress-Archive -Path "build/PCM70Legacy_artefacts/Release/VST3/PCM70 Legacy GUI TEST.vst3" -DestinationPath "PCM70-Legacy-MINIMAL-GUI-0.4.6-Windows-x64-VST3.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: PCM70-Legacy-GUI-TEST-Windows-x64-VST3
          path: PCM70-Legacy-GUI-TEST-Windows-x64-VST3.zip
          if-no-files-found: error
