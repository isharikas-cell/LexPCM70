name: Build Windows VST3
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Extract source archive
        shell: pwsh
        run: Expand-Archive -Path "PCM70_Legacy_VST3_Source_Windows_v0.4.0.zip" -DestinationPath "."
      - name: Configure
        run: cmake -S PCM70_Legacy_VST3_Source -B build -G "Visual Studio 17 2022" -A x64
      - name: Build VST3
        run: cmake --build build --config Release --target PCM70Legacy_VST3 --parallel
      - name: Verify bundle exists
        shell: pwsh
        run: |
          $bundle = "build/PCM70Legacy_artefacts/Release/VST3/PCM70 Legacy.vst3"
          if (!(Test-Path $bundle)) { throw "Expected VST3 bundle was not produced: $bundle" }
          Get-ChildItem $bundle -Recurse | Select-Object FullName, Length
      - name: Package VST3
        shell: pwsh
        run: Compress-Archive -Path "build/PCM70Legacy_artefacts/Release/VST3/PCM70 Legacy.vst3" -DestinationPath "PCM70-Legacy-Windows-x64-VST3.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: PCM70-Legacy-Windows-x64-VST3
          path: PCM70-Legacy-Windows-x64-VST3.zip
          if-no-files-found: error
